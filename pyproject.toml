[project]
name = "beets-kergoth"
version = "0.4.0"
description = "Various personal beets plugins that don't yet have a home elsewhere."
authors = [{ name = "Christopher Larson", email = "kergoth@gmail.com" }]
requires-python = ">=3.10,<3.15"
readme = "README.rst"
license = { text = "Blue Oak Model License 1.0.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "beets>=2.10.0",
    "confuse>=2.0.1,<3",
    "mediafile>=0.12.0",
    "rich>=13.7.1,<14",
]

[project.urls]
Homepage = "https://github.com/kergoth/beets-kergoth"
Repository = "https://github.com/kergoth/beets-kergoth"

[dependency-groups]
dev = [
    "pytest>=7.4,<8",
    "pytest-cram>=0.2.2,<0.3",
    "flake8>=7.1.1,<8",
    "pytest-cov>=5.0.0,<6",
    "cram>=0.7,<0.8",
    "nox>=2026.4.10,<2027",
    "pip-audit>=2.9.0",
    "sphinx>=4.3.2",
]

[tool.uv]
default-groups = "all"

[tool.hatch.build.targets.sdist]
include = ["beetsplug"]

[tool.hatch.build.targets.wheel]
include = ["beetsplug"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
